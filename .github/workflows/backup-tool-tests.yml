name: DZOFT encrypted backup helper checks

on:
  pull_request:
    paths:
      - "tools/backup_dzoft.py"
      - "tests/test_backup_dzoft.py"
      - ".github/workflows/backup-tool-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/backup_dzoft.py"
      - "tests/test_backup_dzoft.py"
      - ".github/workflows/backup-tool-tests.yml"

permissions:
  contents: read

jobs:
  fake-data-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned cryptography dependency
        run: python -m pip install cryptography==46.0.4
      - name: Check Python syntax
        run: python -m py_compile tools/backup_dzoft.py tests/test_backup_dzoft.py
      - name: Exercise encryption and fake Supabase CLI
        run: python -m unittest discover -s tests -p "test_backup_*.py" -v

# No Supabase credentials are configured in this workflow.
# All test records are synthetic. No client data is ever uploaded to GitHub.
