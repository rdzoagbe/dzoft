name: DZOFT encrypted backup helper checks

on:
  pull_request:
    paths:
      - "tools/backup_dzoft.py"
      - "tools/backup_dzoft_native.py"
      - "tools/backup_dzoft_auth.py"
      - "tools/preflight_dzoft_restore.py"
      - "tools/check_dzoft_recovery.py"
      - "tools/restore_dzoft_lab_schema.py"
      - "Start-DZOFT-Recovery.cmd"
      - "tools/backup-dzoft-windows.ps1"
      - "tests/test_backup_dzoft.py"
      - "tests/test_backup_native.py"
      - "tests/test_backup_auth_recovery.py"
      - "tests/test_restore_preflight.py"
      - "tests/test_recovery_evidence.py"
      - "tests/test_restore_lab_schema.py"
      - "tests/test_recovery_launcher.py"
      - ".github/workflows/backup-tool-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/backup_dzoft.py"
      - "tools/backup_dzoft_native.py"
      - "tools/backup_dzoft_auth.py"
      - "tools/preflight_dzoft_restore.py"
      - "tools/check_dzoft_recovery.py"
      - "tools/restore_dzoft_lab_schema.py"
      - "Start-DZOFT-Recovery.cmd"
      - "tools/backup-dzoft-windows.ps1"
      - "tests/test_backup_dzoft.py"
      - "tests/test_backup_native.py"
      - "tests/test_backup_auth_recovery.py"
      - "tests/test_restore_preflight.py"
      - "tests/test_recovery_evidence.py"
      - "tests/test_restore_lab_schema.py"
      - "tests/test_recovery_launcher.py"
      - ".github/workflows/backup-tool-tests.yml"

permissions:
  contents: read

jobs:
  fake-data-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned cryptography dependency
        run: python -m pip install cryptography==46.0.4
      - name: Check Python syntax
        run: python -m py_compile tools/backup_dzoft.py tools/backup_dzoft_native.py tools/backup_dzoft_auth.py tests/test_backup_dzoft.py tests/test_backup_native.py tests/test_backup_auth_recovery.py tools/preflight_dzoft_restore.py tools/check_dzoft_recovery.py tests/test_restore_preflight.py tests/test_recovery_evidence.py tools/restore_dzoft_lab_schema.py tests/test_restore_lab_schema.py tests/test_recovery_launcher.py
      - name: Exercise encryption and fake Supabase CLI
        run: |
          python -m unittest discover -s tests -p "test_backup_*.py" -v
          python -m unittest discover -s tests -p "test_restore_preflight.py" -v
          python -m unittest discover -s tests -p "test_recovery_evidence.py" -v
          python -m unittest discover -s tests -p "test_restore_lab_schema.py" -v
          python -m unittest discover -s tests -p "test_recovery_launcher.py" -v

# No Supabase credentials are configured in this workflow.
# All test records are synthetic. No client data is ever uploaded to GitHub.
