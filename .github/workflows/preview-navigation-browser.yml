name: DZOFT navigation Chromium smoke

on:
  # Required check on main: it must run on every pull request, or client-only changes cannot merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Exercise navigation in real Chromium without owner credentials
        run: npx playwright test e2e/global-overview-navigation.spec.mjs e2e/page-by-page-navigation.spec.mjs e2e/manual-change-proposal-review.spec.mjs
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dzoft-navigation-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
