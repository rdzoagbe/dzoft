 var map={overview:'overview',quotes:'overview',invoices:'billing/c-inv',payments:'billing/pay',extras:'billing/c-changes',
  'new-extra':'billing/new-extra',activity:'messages',journal:'work/c-journal',documents:'documents'};
 var to=map[location.hash.slice(1)]||'overview';
 location.replace('suivi.html?q='+encodeURIComponent(q)+'#'+to);
})();
