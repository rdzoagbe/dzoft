<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>img</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}img{width:100vw;height:100vh;object-fit:cover;display:block}</style></head><body>
<script>var q=new URLSearchParams(location.search);document.write('<img src="https://images.unsplash.com/photo-'+q.get('id')+'?w='+(q.get('w')||1600)+'&h='+(q.get('h')||1000)+'&fit=crop&q=82'+(q.get('crop')?'&crop='+q.get('crop'):'')+'">');</script></body></html>
